<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Очеловечиватель текста</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 700px; margin: auto; background: #f5f5f5; }
    textarea { width: 100%; height: 180px; margin-bottom: 20px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; }
    .output { background: #fff; padding: 15px; border: 1px solid #ccc; min-height: 150px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Очеловечиватель текста 🤖→🧠</h1>
  <p>Вставь AI-текст ниже — мы его перепишем так, будто его писал человек.</p>
  <textarea id="inputText" placeholder="Вставь сюда текст от ИИ..."></textarea>
  <button onclick="humanize()">Очеловечить</button>
  <h2>Результат:</h2>
  <div id="output" class="output"></div>

  <script>
    function humanize() {
      const text = document.getElementById("inputText").value;

      if (!text.trim()) {
        document.getElementById("output").innerText = "Пожалуйста, вставьте текст.";
        return;
      }

      // Простейшая имитация очеловечивания (можно доработать)
      let result = text
        .replace(/в связи с тем, что/g, 'потому что')
        .replace(/таким образом/g, 'поэтому')
        .replace(/является/g, 'это')
        .replace(/осуществляется/g, 'делается')
        .replace(/в рамках/g, 'в пределах')
        .replace(/настоящий документ/g, 'этот документ')
        .replace(/представляется возможным/g, 'можно')
        .replace(/в целях/g, 'чтобы')
        .replace(/необходимо/g, 'нужно')
        .replace(/имеется/g, 'есть')
        .replace(/следует отметить, что/g, 'важно отметить, что')
        .replace(/\bданный\b/g, 'этот')
        .replace(/\bтаким образом\b/g, 'значит')
        .replace(/\bвышеперечисленное\b/g, 'всё это')
        .replace(/\bв том числе\b/g, 'включая')
        .replace(/\bнаиболее\b/g, 'самый');

      result += "\n\n(переписано в более разговорной форме)";
      document.getElementById("output").innerText = result;
    }
  </script>
</body>
</html>
